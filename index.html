<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Kingshop102 - Get Bypass Link</title>
<style>
  * {
    margin: 0;
    padding: 0;
    box-sizing: border-box;
    font-family: 'Segoe UI', Roboto, Arial, sans-serif;
  }

  body {
    min-height: 100vh;
    background: linear-gradient(135deg, #0f0c29, #302b63, #24243e);
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 20px;
    color: #fff;
  }

  .container {
    width: 100%;
    max-width: 420px;
    background: rgba(255, 255, 255, 0.06);
    backdrop-filter: blur(15px);
    border: 1px solid rgba(255, 255, 255, 0.12);
    border-radius: 24px;
    padding: 32px 26px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    text-align: center;
    animation: fadeIn 0.6s ease;
  }

  @keyframes fadeIn {
    from { opacity: 0; transform: translateY(20px); }
    to { opacity: 1; transform: translateY(0); }
  }

  .logo {
    width: 70px;
    height: 70px;
    margin: 0 auto 16px;
    border-radius: 50%;
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    display: flex;
    align-items: center;
    justify-content: center;
    font-size: 34px;
    box-shadow: 0 0 25px rgba(254, 44, 85, 0.5);
    animation: pulse 2s infinite;
  }

  @keyframes pulse {
    0%, 100% { box-shadow: 0 0 25px rgba(254, 44, 85, 0.5); }
    50% { box-shadow: 0 0 40px rgba(37, 244, 238, 0.7); }
  }

  h1 {
    font-size: 22px;
    margin-bottom: 8px;
    background: linear-gradient(90deg, #25F4EE, #FE2C55);
    -webkit-background-clip: text;
    -webkit-text-fill-color: transparent;
    background-clip: text;
  }

  .subtitle {
    font-size: 13px;
    color: #b8b8d0;
    margin-bottom: 28px;
    line-height: 1.5;
  }

  .btn {
    width: 100%;
    padding: 15px 18px;
    border: none;
    border-radius: 14px;
    font-size: 15px;
    font-weight: 700;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    gap: 10px;
    text-decoration: none;
    transition: all 0.25s ease;
    margin-bottom: 14px;
    position: relative;
    overflow: hidden;
  }

  .btn-tiktok {
    background: linear-gradient(135deg, #25F4EE, #FE2C55);
    color: #fff;
    box-shadow: 0 8px 22px rgba(254, 44, 85, 0.4);
  }

  .btn-tiktok:hover {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(254, 44, 85, 0.6);
  }

  .btn-tiktok:active {
    transform: translateY(0);
  }

  .btn-bypass {
    background: linear-gradient(135deg, #00c853, #00e676);
    color: #062b13;
    box-shadow: 0 8px 22px rgba(0, 200, 83, 0.35);
  }

  .btn-bypass:hover:not(.locked) {
    transform: translateY(-2px);
    box-shadow: 0 12px 30px rgba(0, 200, 83, 0.55);
  }

  .btn-bypass.locked {
    background: rgba(255, 255, 255, 0.08);
    color: #8888a0;
    cursor: not-allowed;
    box-shadow: none;
    border: 1px dashed rgba(255, 255, 255, 0.2);
  }

  .status {
    font-size: 12.5px;
    margin-top: 14px;
    padding: 10px;
    border-radius: 10px;
    transition: all 0.3s ease;
  }

  .status.locked-state {
    background: rgba(255, 80, 80, 0.12);
    color: #ff7a7a;
    border: 1px solid rgba(255, 80, 80, 0.25);
  }

  .status.unlocked-state {
    background: rgba(0, 230, 118, 0.12);
    color: #4dffa6;
    border: 1px solid rgba(0, 230, 118, 0.3);
  }

  .icon {
    font-size: 18px;
  }

  .footer {
    margin-top: 22px;
    font-size: 11px;
    color: #6c6c8a;
  }

  @keyframes shake {
    0%, 100% { transform: translateX(0); }
    25% { transform: translateX(-6px); }
    75% { transform: translateX(6px); }
  }
</style>
</head>
<body>
  <div class="container">
    <div class="logo">👑</div>
    <h1>KINGSHOP102</h1>
    <p class="subtitle">Follow TikTok để mở khóa link bypass<br>Bước 1: Follow → Bước 2: Lấy link</p>

    <a id="tiktokBtn" class="btn btn-tiktok" href="https://tiktok.com/@kingshop102" target="_blank" rel="noopener">
      <span class="icon">🎵</span> Follow TikTok @kingshop102
    </a>

    <a id="bypassBtn" class="btn btn-bypass locked" href="#" aria-disabled="true">
      <span class="icon" id="lockIcon">🔒</span>
      <span id="bypassText">Lấy Bypass Link (Đã khóa)</span>
    </a>

    <div id="status" class="status locked-state">⚠️ Bạn cần Follow TikTok trước để mở khóa</div>

    <div class="footer">© 2025 Kingshop102 • Tool Bypass</div>
  </div>

  <script>
    (function () {
      const BYPASS_URL = 'https://toolbypass42.github.io/Chygjkig/';
      const STORAGE_KEY = 'ks102_unlocked_v2';

      const tiktokBtn  = document.getElementById('tiktokBtn');
      const bypassBtn  = document.getElementById('bypassBtn');
      const lockIcon   = document.getElementById('lockIcon');
      const bypassText = document.getElementById('bypassText');
      const status     = document.getElementById('status');

      // Kiểm tra trạng thái đã lưu
      function isUnlocked() {
        try {
          return localStorage.getItem(STORAGE_KEY) === 'true';
        } catch (e) {
          return false;
        }
      }

      function saveUnlocked() {
        try {
          localStorage.setItem(STORAGE_KEY, 'true');
        } catch (e) {}
      }

      // Cập nhật giao diện theo trạng thái
      function render() {
        if (isUnlocked()) {
          bypassBtn.classList.remove('locked');
          bypassBtn.setAttribute('href', BYPASS_URL);
          bypassBtn.setAttribute('target', '_blank');
          bypassBtn.setAttribute('rel', 'noopener');
          bypassBtn.removeAttribute('aria-disabled');
          lockIcon.textContent = '🔓';
          bypassText.textContent = 'Lấy Bypass Link';
          status.className = 'status unlocked-state';
          status.textContent = '✅ Đã mở khóa! Nhấn "Lấy Bypass Link" để tiếp tục';
        } else {
          bypassBtn.classList.add('locked');
          bypassBtn.setAttribute('href', '#');
          bypassBtn.removeAttribute('target');
          bypassBtn.removeAttribute('rel');
          bypassBtn.setAttribute('aria-disabled', 'true');
          lockIcon.textContent = '🔒';
          bypassText.textContent = 'Lấy Bypass Link (Đã khóa)';
          status.className = 'status locked-state';
          status.textContent = '⚠️ Bạn cần Follow TikTok trước để mở khóa';
        }
      }

      // Khi click nút TikTok → mở link và mở khóa
      tiktokBtn.addEventListener('click', function () {
        if (!isUnlocked()) {
          saveUnlocked();
          render();
        }
      });

      // Chặn click nút bypass khi còn khóa
      bypassBtn.addEventListener('click', function (e) {
        if (!isUnlocked()) {
          e.preventDefault();
          status.textContent = '🚫 Vui lòng Follow TikTok trước!';
          status.className = 'status locked-state';
          bypassBtn.style.animation = 'none';
          bypassBtn.offsetHeight;
          bypassBtn.style.animation = 'shake 0.4s';
        }
      });

      // Khởi tạo
      render();
    })();
  </script>
</body>
</html>
